# Fly.io configuration for Netdata Alternative UI
#
# Deploy with: flyctl launch --config fly.toml
# or: flyctl deploy
#
# IMPORTANT: Set secrets before deploying:
#   flyctl secrets set AUTH_USERNAME=admin AUTH_PASSWORD=your-secure-password API_KEY=your-api-key
#
# Authentication:
#   - AUTH_USERNAME + AUTH_PASSWORD: Protects the web dashboard (HTTP Basic Auth)
#   - API_KEY: Used by collectors to push metrics (X-API-Key header)

app = "netdata-k0s-demo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # Retention period for metrics (1 hour default)
  RETENTION = "1h"
  # Maximum data points per dimension
  MAX_POINTS = "3600"

# Secrets (set via flyctl secrets set):
# - AUTH_USERNAME: Username for dashboard login
# - AUTH_PASSWORD: Password for dashboard login
# - API_KEY: API key for metric push authentication

[http_service]
  internal_port = 19998
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
