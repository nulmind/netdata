# Fly.io configuration for Netdata Alternative UI
#
# Deploy with: flyctl launch --config fly.toml
# or: flyctl deploy

app = "netdata-k0s-demo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # Retention period for metrics (1 hour default)
  RETENTION = "1h"
  # Maximum data points per dimension
  MAX_POINTS = "3600"

[http_service]
  internal_port = 19998
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
