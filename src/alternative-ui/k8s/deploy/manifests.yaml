# Kubernetes manifests for deploying the k8s-collector
# This collector pushes metrics to the Alternative UI server
#
# Usage:
#   kubectl apply -f manifests.yaml
#
# Before applying, update:
#   - PUSH_URL: URL of your Alternative UI server (e.g., https://your-app.fly.dev)
#   - CLUSTER_NAME: A unique name for your cluster

---
apiVersion: v1
kind: Namespace
metadata:
  name: netdata-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-collector
  namespace: netdata-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  # Metrics API (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-collector
subjects:
  - kind: ServiceAccount
    name: k8s-collector
    namespace: netdata-collector

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-collector-config
  namespace: netdata-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector
data:
  # Update this URL to your Alternative UI server
  PUSH_URL: "https://netdata-k0s-demo.fly.dev"
  # Name to identify this cluster
  CLUSTER_NAME: "k0s-demo-cluster"
  # Collection interval
  INTERVAL: "10s"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-collector
  namespace: netdata-collector
  labels:
    app.kubernetes.io/name: netdata-k8s-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netdata-k8s-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netdata-k8s-collector
    spec:
      serviceAccountName: k8s-collector
      containers:
        - name: collector
          image: ghcr.io/netdata/k8s-collector:latest
          imagePullPolicy: Always
          args:
            - "-url"
            - "$(PUSH_URL)"
            - "-cluster-name"
            - "$(CLUSTER_NAME)"
            - "-interval"
            - "$(INTERVAL)"
          envFrom:
            - configMapRef:
                name: k8s-collector-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      # Prefer running on controller/master nodes for better k0s detection
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
